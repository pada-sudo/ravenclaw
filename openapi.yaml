openapi: 3.1.0
info:
  title: DDP Project Control API
  version: '2.1.0'
  description: API kontrak untuk aplikasi DDP Project Control — backend oleh Bagas (stage 1), auth/hardening oleh Victor (stage 2).
servers:
  - url: http://localhost:3000
paths:
  /healthz:
    get:
      summary: Health check
      operationId: getHealthz
      security: []
      responses:
        '200':
          description: Aplikasi sehat.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string }
                  timestamp: { type: string, format: date-time }
  /api/auth/login:
    post:
      summary: Login
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string }
                password: { type: string }
      responses:
        '200':
          description: Login berhasil; cookie ddp_session di-set.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  user:
                    type: object
                    properties:
                      username: { type: string }
                      full_name: { type: string }
                      role: { type: string, enum: [operator, pm, approver, auditor] }
                  expires_at: { type: string, format: date-time }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/RateLimit' }
  /api/auth/logout:
    post:
      summary: Logout
      operationId: logout
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Logout berhasil; cookie dihapus.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
  /api/auth/session:
    get:
      summary: Sesi pengguna saat ini
      operationId: getSession
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Informasi pengguna yang sedang login.
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    type: object
                    properties:
                      username: { type: string }
                      full_name: { type: string }
                      role: { type: string, enum: [operator, pm, approver, auditor] }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/kpis:
    get:
      summary: KPI dashboard
      operationId: getKpis
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Ringkasan KPI dan daftar blocker terbuka.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Kpis'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimit' }
  /api/projects:
    get:
      summary: Daftar proyek
      operationId: listProjects
      security:
        - sessionCookie: []
      parameters:
        - in: query
          name: track
          schema: { type: string, enum: [first_responder, buffer] }
        - in: query
          name: gate
          schema: { type: string, enum: [G0, G1, G2A, G2B, G3, G4, G5, CLOSED] }
        - in: query
          name: status
          schema: { type: string, enum: [active, pending, blocked, closed] }
        - in: query
          name: include_deleted
          schema: { type: boolean }
        - in: query
          name: limit
          schema: { type: integer, default: 50, maximum: 200 }
        - in: query
          name: offset
          schema: { type: integer, default: 0 }
      responses:
        '200':
          description: Daftar proyek + metadata pagination.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/ProjectListItem' } }
                  pagination: { $ref: '#/components/schemas/Pagination' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimit' }
    post:
      summary: Intake proyek baru
      operationId: createProject
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectInput'
      responses:
        '200':
          description: Proyek berhasil dibuat beserta deliverable/checklist awal.
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: integer }
                  code: { type: string }
                  procurement: { $ref: '#/components/schemas/ProcurementInfo' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/RateLimit' }
  /api/projects/{id}:
    get:
      summary: Detail proyek lengkap
      operationId: getProject
      security:
        - sessionCookie: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: Detail proyek beserta relasi.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectDetail'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      summary: Perbarui data proyek
      operationId: updateProject
      security:
        - sessionCookie: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectUpdate'
      responses:
        '200':
          description: Proyek terbarui.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Project' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/RateLimit' }
    delete:
      summary: Hapus (soft delete) proyek
      operationId: deleteProject
      security:
        - sessionCookie: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: Proyek dihapus secara logis.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  deleted: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimit' }
  /api/projects/{id}/advance:
    post:
      summary: Naikkan gate
      operationId: advanceGate
      security:
        - sessionCookie: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                force: { type: boolean, default: false }
                force_reason: { type: string, maxLength: 2000 }
      responses:
        '200':
          description: Gate naik.
          content:
            application/json:
              schema:
                type: object
                properties:
                  next: { type: string }
                  forced: { type: boolean }
                  gaps: { type: array, items: { type: string } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/RateLimit' }
  /api/projects/{id}/close:
    post:
      summary: Tandai proyek selesai
      operationId: closeProject
      security:
        - sessionCookie: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: Proyek ditutup.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  gate: { type: string }
                  status: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimit' }
  /api/projects/{id}/reopen:
    post:
      summary: Buka kembali proyek
      operationId: reopenProject
      security:
        - sessionCookie: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: Proyek aktif kembali.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  gate: { type: string }
                  status: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimit' }
  /api/projects/{id}/gate_notes/{gate}:
    put:
      summary: Catatan proses gate
      operationId: putGateNote
      security:
        - sessionCookie: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
        - in: path
          name: gate
          required: true
          schema: { type: string, enum: [G0, G1, G2A, G2B, G3, G4, G5, CLOSED] }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                note: { type: string, maxLength: 4000 }
      responses:
        '200':
          description: Catatan tersimpan.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/RateLimit' }
  /api/projects/{id}/deliverables:
    post:
      summary: Tambah deliverable
      operationId: addDeliverable
      security:
        - sessionCookie: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeliverableInput'
      responses:
        '200':
          description: Deliverable terbuat.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Deliverable' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/RateLimit' }
  /api/projects/{id}/deliverables/{did}:
    put:
      summary: Update deliverable
      operationId: updateDeliverable
      security:
        - sessionCookie: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
        - in: path
          name: did
          required: true
          schema: { type: integer }
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeliverableUpdate'
      responses:
        '200':
          description: Deliverable terbarui.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Deliverable' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/RateLimit' }
    delete:
      summary: Hapus deliverable
      operationId: deleteDeliverable
      security:
        - sessionCookie: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
        - in: path
          name: did
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: Deliverable terhapus.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/RateLimit' }
  /api/projects/{id}/buffer_checks:
    post:
      summary: Tambah prasyarat Buffer
      operationId: addBufferCheck
      security:
        - sessionCookie: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                item: { type: string, maxLength: 300 }
      responses:
        '200':
          description: Prasyarat terbuat.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/RateLimit' }
  /api/projects/{id}/buffer_checks/{cid}:
    put:
      summary: Update prasyarat Buffer
      operationId: updateBufferCheck
      security:
        - sessionCookie: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
        - in: path
          name: cid
          required: true
          schema: { type: integer }
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BufferCheckUpdate'
      responses:
        '200':
          description: Prasyarat terbarui.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BufferCheck' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/RateLimit' }
    delete:
      summary: Hapus prasyarat Buffer
      operationId: deleteBufferCheck
      security:
        - sessionCookie: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
        - in: path
          name: cid
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: Prasyarat terhapus.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/RateLimit' }
  /api/projects/{id}/reports:
    post:
      summary: Simpan weekly report
      operationId: addReport
      security:
        - sessionCookie: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WeeklyReportInput'
      responses:
        '200':
          description: Report tersimpan.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/RateLimit' }
  /api/reports/{rid}/confirm:
    put:
      summary: Konfirmasi weekly report oleh PM
      operationId: confirmReport
      security:
        - sessionCookie: []
      parameters:
        - in: path
          name: rid
          required: true
          schema: { type: integer }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                pm_confirmed_by: { type: string, maxLength: 200 }
      responses:
        '200':
          description: Report dikonfirmasi.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimit' }
  /api/projects/{id}/risks:
    post:
      summary: Tambah item RAID
      operationId: addRisk
      security:
        - sessionCookie: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RiskInput'
      responses:
        '200':
          description: Item RAID tersimpan.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/RateLimit' }
  /api/risks/{rid}:
    put:
      summary: Update status/item RAID
      operationId: updateRisk
      security:
        - sessionCookie: []
      parameters:
        - in: path
          name: rid
          required: true
          schema: { type: integer }
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RiskUpdate'
      responses:
        '200':
          description: Item RAID terbarui.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimit' }
  /api/projects/{id}/changes:
    post:
      summary: Ajukan change request
      operationId: addChangeRequest
      security:
        - sessionCookie: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangeRequestInput'
      responses:
        '200':
          description: Change request tersimpan.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/RateLimit' }
  /api/changes/{cid}:
    put:
      summary: Keputusan change request
      operationId: updateChangeRequest
      security:
        - sessionCookie: []
      parameters:
        - in: path
          name: cid
          required: true
          schema: { type: integer }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                status: { type: string, enum: [diajukan, disetujui, ditolak] }
      responses:
        '200':
          description: Change request terbarui.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/RateLimit' }
  /api/meta:
    get:
      summary: Metadata domain
      operationId: getMeta
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Enum, gate sequence, daftar deliverable/checklist wajib.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Meta'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimit' }
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: ddp_session
  responses:
    NotFound:
      description: Resource tidak ditemukan.
      content:
        application/json:
          schema:
            type: object
            properties:
              error: { type: string }
    ValidationError:
      description: Input tidak valid.
      content:
        application/json:
          schema:
            type: object
            properties:
              error: { type: string }
              next: { type: string }
              gaps: { type: array, items: { type: string } }
    RateLimit:
      description: Rate limit terlampaui.
      content:
        application/json:
          schema:
            type: object
            properties:
              error: { type: string }
    Unauthorized:
      description: Autentikasi diperlukan.
      content:
        application/json:
          schema:
            type: object
            properties:
              error: { type: string }
    Forbidden:
      description: Akses ditolak.
      content:
        application/json:
          schema:
            type: object
            properties:
              error: { type: string }
  schemas:
    Pagination:
      type: object
      properties:
        total: { type: integer }
        limit: { type: integer }
        offset: { type: integer }
    Project:
      type: object
      properties:
        id: { type: integer }
        code: { type: string }
        name: { type: string }
        customer_cfu: { type: string }
        tribe_unit: { type: string }
        business_owner: { type: string }
        pm: { type: string }
        project_type: { type: string, enum: [new, existing] }
        track: { type: string, enum: [first_responder, buffer] }
        reason_shared_service: { type: string }
        nde_no: { type: string }
        nde_date: { type: string, format: date }
        budget_status: { type: string, enum: [belum_diajukan, diajukan, disetujui] }
        procurement_doc: { type: string }
        procurement_target_start: { type: string, format: date }
        procurement_submit_by: { type: string }
        onboarding_status: { type: string, enum: [belum_mulai, berjalan, selesai] }
        gate: { type: string, enum: [G0, G1, G2A, G2B, G3, G4, G5, CLOSED] }
        status: { type: string, enum: [active, pending, blocked, closed] }
        prev_gate: { type: string }
        fte: { type: string }
        start_date: { type: string, format: date }
        end_date: { type: string, format: date }
        bridging_end: { type: string, format: date }
        bpom_case: { type: integer }
        definitive_plan: { type: string }
        notes: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        deleted_at: { type: string, format: date-time }
    ProjectListItem:
      allOf:
        - $ref: '#/components/schemas/Project'
        - type: object
          properties:
