openapi: 3.1.0
info:
  title: RavenClaw API
  version: '2.2.0'
  description: |
    API kontrak untuk aplikasi RavenClaw — backend oleh Bagas (stage 1), auth/hardening oleh Victor (stage 2).

    Versi 2.2.0 menambahkan kontrak penyelarasan PRD v1.0 (23 Okt 2026). Setiap operasi yang
    belum ada di runtime ditandai `x-impl-status: contract-only`; operasi yang sudah berjalan
    ditandai `x-impl-status: implemented`. Kontrak ini tidak mengubah perilaku runtime apa pun
    (lihat `docs/ADR/ADR-005-prd-v1-alignment.md`).
  x-prd-alignment:
    prd_version: '1.0'
    prd_date: '2026-10-23'
    source_issue: DEEP-235
    adr: docs/ADR/ADR-005-prd-v1-alignment.md
    domain_rules: docs/DOMAIN-RULES.md
servers:
  - url: http://localhost:3000
paths:
  /healthz:
    get:
      summary: Health check
      operationId: getHealthz
      security: []
      responses:
        '200':
          description: Aplikasi sehat.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string }
                  timestamp: { type: string, format: date-time }
  /api/auth/login:
    post:
      summary: Login
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string }
                password: { type: string }
      responses:
        '200':
          description: Login berhasil; cookie ddp_session di-set.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  user:
                    type: object
                    properties:
                      username: { type: string }
                      full_name: { type: string }
                      role: { type: string, enum: [operator, pm, approver, auditor] }
                  expires_at: { type: string, format: date-time }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/RateLimit' }
  /api/auth/logout:
    post:
      summary: Logout
      operationId: logout
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Logout berhasil; cookie dihapus.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
  /api/auth/session:
    get:
      summary: Sesi pengguna saat ini
      operationId: getSession
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Informasi pengguna yang sedang login.
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    type: object
                    properties:
                      username: { type: string }
                      full_name: { type: string }
                      role: { type: string, enum: [operator, pm, approver, auditor] }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/kpis:
    get:
      summary: KPI dashboard
      operationId: getKpis
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Ringkasan KPI dan daftar blocker terbuka.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Kpis'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimit' }
  /api/projects:
    get:
      summary: Daftar proyek
      operationId: listProjects
      security:
        - sessionCookie: []
      parameters:
        - in: query
          name: track
          schema: { type: string, enum: [first_responder, buffer] }
        - in: query
          name: gate
          schema: { type: string, enum: [G0, G1, G2A, G2B, G3, G4, G5, CLOSED] }
        - in: query
          name: status
          schema: { type: string, enum: [active, pending, blocked, closed] }
        - in: query
          name: include_deleted
          schema: { type: boolean }
        - in: query
          name: limit
          schema: { type: integer, default: 50, maximum: 200 }
        - in: query
          name: offset
          schema: { type: integer, default: 0 }
      responses:
        '200':
          description: Daftar proyek + metadata pagination.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/ProjectListItem' } }
                  pagination: { $ref: '#/components/schemas/Pagination' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimit' }
    post:
      summary: Intake proyek baru
      operationId: createProject
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectInput'
      responses:
        '200':
          description: Proyek berhasil dibuat beserta deliverable/checklist awal.
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: integer }
                  code: { type: string }
                  procurement: { $ref: '#/components/schemas/ProcurementInfo' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/RateLimit' }
  /api/projects/{id}:
    get:
      summary: Detail proyek lengkap
      operationId: getProject
      security:
        - sessionCookie: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: Detail proyek beserta relasi.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectDetail'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      summary: Perbarui data proyek
      operationId: updateProject
      security:
        - sessionCookie: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectUpdate'
      responses:
        '200':
          description: Proyek terbarui.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Project' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/RateLimit' }
    delete:
      summary: Hapus (soft delete) proyek
      operationId: deleteProject
      security:
        - sessionCookie: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: Proyek dihapus secara logis.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  deleted: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimit' }
  /api/projects/{id}/advance:
    post:
      summary: Naikkan gate
      operationId: advanceGate
      security:
        - sessionCookie: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                force: { type: boolean, default: false }
                force_reason: { type: string, maxLength: 2000 }
      responses:
        '200':
          description: Gate naik.
          content:
            application/json:
              schema:
                type: object
                properties:
                  next: { type: string }
                  forced: { type: boolean }
                  gaps: { type: array, items: { type: string } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/RateLimit' }
  /api/projects/{id}/close:
    post:
      summary: Tandai proyek selesai
      operationId: closeProject
      security:
        - sessionCookie: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: Proyek ditutup.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  gate: { type: string }
                  status: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimit' }
  /api/projects/{id}/reopen:
    post:
      summary: Buka kembali proyek
      operationId: reopenProject
      security:
        - sessionCookie: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: Proyek aktif kembali.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  gate: { type: string }
                  status: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimit' }
  /api/projects/{id}/gate_notes/{gate}:
    put:
      summary: Catatan proses gate
      operationId: putGateNote
      security:
        - sessionCookie: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
        - in: path
          name: gate
          required: true
          schema: { type: string, enum: [G0, G1, G2A, G2B, G3, G4, G5, CLOSED] }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                note: { type: string, maxLength: 4000 }
      responses:
        '200':
          description: Catatan tersimpan.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/RateLimit' }
  /api/projects/{id}/deliverables:
    post:
      summary: Tambah deliverable
      operationId: addDeliverable
      security:
        - sessionCookie: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeliverableInput'
      responses:
        '200':
          description: Deliverable terbuat.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Deliverable' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/RateLimit' }
  /api/projects/{id}/deliverables/{did}:
    put:
      summary: Update deliverable
      operationId: updateDeliverable
      security:
        - sessionCookie: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
        - in: path
          name: did
          required: true
          schema: { type: integer }
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeliverableUpdate'
      responses:
        '200':
          description: Deliverable terbarui.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Deliverable' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/RateLimit' }
    delete:
      summary: Hapus deliverable
      operationId: deleteDeliverable
      security:
        - sessionCookie: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
        - in: path
          name: did
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: Deliverable terhapus.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/RateLimit' }
  /api/projects/{id}/buffer_checks:
    post:
      summary: Tambah prasyarat Buffer
      operationId: addBufferCheck
      security:
        - sessionCookie: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                item: { type: string, maxLength: 300 }
      responses:
        '200':
          description: Prasyarat terbuat.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/RateLimit' }
  /api/projects/{id}/buffer_checks/{cid}:
    put:
      summary: Update prasyarat Buffer
      operationId: updateBufferCheck
      security:
        - sessionCookie: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
        - in: path
          name: cid
          required: true
          schema: { type: integer }
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BufferCheckUpdate'
      responses:
        '200':
          description: Prasyarat terbarui.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BufferCheck' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/RateLimit' }
    delete:
      summary: Hapus prasyarat Buffer
      operationId: deleteBufferCheck
      security:
        - sessionCookie: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
        - in: path
          name: cid
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: Prasyarat terhapus.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/RateLimit' }
  /api/projects/{id}/reports:
    post:
      summary: Simpan weekly report
      operationId: addReport
      security:
        - sessionCookie: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WeeklyReportInput'
      responses:
        '200':
          description: Report tersimpan.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/RateLimit' }
  /api/reports/{rid}/confirm:
    put:
      summary: Konfirmasi weekly report oleh PM
      operationId: confirmReport
      security:
        - sessionCookie: []
      parameters:
        - in: path
          name: rid
          required: true
          schema: { type: integer }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                pm_confirmed_by: { type: string, maxLength: 200 }
      responses:
        '200':
          description: Report dikonfirmasi.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimit' }
  /api/projects/{id}/risks:
    post:
      summary: Tambah item RAID
      operationId: addRisk
      security:
        - sessionCookie: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RiskInput'
      responses:
        '200':
          description: Item RAID tersimpan.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/RateLimit' }
  /api/risks/{rid}:
    put:
      summary: Update status/item RAID
      operationId: updateRisk
      security:
        - sessionCookie: []
      parameters:
        - in: path
          name: rid
          required: true
          schema: { type: integer }
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RiskUpdate'
      responses:
        '200':
          description: Item RAID terbarui.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimit' }
  /api/projects/{id}/changes:
    post:
      summary: Ajukan change request
      operationId: addChangeRequest
      security:
        - sessionCookie: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangeRequestInput'
      responses:
        '200':
          description: Change request tersimpan.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/RateLimit' }
  /api/changes/{cid}:
    put:
      summary: Keputusan change request
      operationId: updateChangeRequest
      security:
        - sessionCookie: []
      parameters:
        - in: path
          name: cid
          required: true
          schema: { type: integer }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                status: { type: string, enum: [diajukan, disetujui, ditolak] }
      responses:
        '200':
          description: Change request terbarui.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/RateLimit' }
  /api/meta:
    get:
      summary: Metadata domain
      operationId: getMeta
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Enum, gate sequence, daftar deliverable/checklist wajib.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Meta'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimit' }
  /api/roles:
    get:
      summary: Katalog peran R01–R15 dan matriks izin per aksi
      description: >
        Kontrak target untuk FR-10..FR-14. Sumber aturan: `docs/DOMAIN-RULES.md` §16 dan
        `docs/ADR/ADR-005-prd-v1-alignment.md`. Matriks izin hanya boleh punya satu definisi
        di kode (`lib/auth.js`). Pengguna dengan peran legacy tetap mendapat
        `legacy_equivalent` agar sesi lama tidak pecah.
      operationId: listRoles
      x-impl-status: contract-only
      x-prd-fr: [FR-10, FR-11, FR-12, FR-13, FR-14]
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Katalog peran + matriks izin per aksi.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoleCatalog'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimit' }
  /api/raci:
    get:
      summary: Matriks RACI per gate
      description: >
        Kontrak target untuk FR-13. RACI adalah data, bukan halaman. Default RACI per gate
        ada di `docs/DOMAIN-RULES.md` §16.4; menunggu konfirmasi otoritas resmi (OQ-01).
      operationId: listRaci
      x-impl-status: contract-only
      x-prd-fr: [FR-13]
      security:
        - sessionCookie: []
      parameters:
        - in: query
          name: gate
          schema: { $ref: '#/components/schemas/GateId' }
      responses:
        '200':
          description: Entri RACI per gate dan peran.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/RaciEntry' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimit' }
  /api/projects/{id}/gates/{gate}:
    put:
      summary: Ubah status satu gate (FR-07) dan rekam evidence/approval
      description: >
        Kontrak target. Status gate mengikuti `belum_mulai → dalam_proses → review → disetujui`.
        Transisi ke `disetujui` hanya boleh oleh approver yang ditetapkan untuk gate tersebut
        (FR-09, FR-12) dan wajib menyertakan minimal satu evidence (FR-08, FR-17).
        Penolakan saat `review` mengembalikan status ke `dalam_proses` disertai `note`.
      operationId: putGateStatus
      x-impl-status: contract-only
      x-prd-fr: [FR-07, FR-08, FR-09, FR-12, FR-17]
      security:
        - sessionCookie: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
        - in: path
          name: gate
          required: true
          schema: { $ref: '#/components/schemas/GateId' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GateStatusInput'
      responses:
        '200':
          description: Status gate tersimpan.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GateRecord' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/RateLimit' }
  /api/projects/{id}/buffer_controls/{code}:
    put:
      summary: Ubah status kontrol Buffer B1–B4 atau sub-gate s4/sY
      description: >
        Kontrak target untuk FR-02 dan FR-03. Kontrol ini **opsional** (default `tidak_berlaku`
        selama OQ-03 belum dijawab) dan tidak pernah menahan kenaikan gate. Berbeda dari
        `buffer_checks` (8 prasyarat SOP-04 yang wajib untuk G2B) — lihat `docs/DOMAIN-RULES.md`
        §15.
      operationId: putBufferControl
      x-impl-status: contract-only
      x-prd-fr: [FR-02, FR-03]
      security:
        - sessionCookie: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
        - in: path
          name: code
          required: true
          schema: { $ref: '#/components/schemas/ControlCode' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BufferControlInput'
      responses:
        '200':
          description: Kontrol tersimpan.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BufferControl' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/RateLimit' }
  /api/projects/{id}/acceptance:
    put:
      summary: Rekam BAST / sign-off customer (G5)
      description: >
        Kontrak target untuk FR-35..FR-37. `POST /api/projects/{id}/close` hanya boleh berhasil
        bila `acceptance.status = ditandatangani` dan evidence acceptance tersedia.
        BAST hanya boleh direkam/ditandatangani oleh R13 (Customer) dengan pengetahuan R10.
      operationId: putAcceptance
      x-impl-status: contract-only
      x-prd-fr: [FR-35, FR-36, FR-37]
      security:
        - sessionCookie: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AcceptanceInput'
      responses:
        '200':
          description: BAST tersimpan.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Acceptance' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/RateLimit' }
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: ddp_session
  responses:
    NotFound:
      description: Resource tidak ditemukan.
      content:
        application/json:
          schema:
            type: object
            properties:
              error: { type: string }
    ValidationError:
      description: Input tidak valid.
      content:
        application/json:
          schema:
            type: object
            properties:
              error: { type: string }
              next: { type: string }
              gaps: { type: array, items: { type: string } }
    RateLimit:
      description: Rate limit terlampaui.
      content:
        application/json:
          schema:
            type: object
            properties:
              error: { type: string }
    Unauthorized:
      description: Autentikasi diperlukan.
      content:
        application/json:
          schema:
            type: object
            properties:
              error: { type: string }
    Forbidden:
      description: Akses ditolak.
      content:
        application/json:
          schema:
            type: object
            properties:
              error: { type: string }
