        pm: { type: string }
        project_type: { type: string, enum: [new, existing] }
        path: { $ref: '#/components/schemas/ProjectPath' }
        chapter_manager: { type: string }
        scope: { type: string }
        data_classification: { $ref: '#/components/schemas/DataClassification' }
        pdp_scope: { type: boolean }
        track: { type: string, enum: [first_responder, buffer] }
        gate_status: { $ref: '#/components/schemas/GateStatus' }
        reason_shared_service: { type: string }
        nde_no: { type: string }
        nde_date: { type: string, format: date }
        budget_status: { type: string, enum: [belum_diajukan, diajukan, disetujui] }
